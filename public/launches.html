<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aether — Launches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,700&display=swap">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<link rel="stylesheet" href="app.css">
<style>
  .browse { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 40px; align-items: start; }
  @media (max-width: 860px) { .browse { grid-template-columns: 1fr; } }

  .filters { position: sticky; top: 28px; }
  .filters .field { margin-bottom: 20px; }
  .filters label { font-size: 12.5px; }
  .filters select, .filters input { font-size: 14px; padding: 8px 0; }
  .filter-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
  .filter-head .eyebrow { margin: 0; }

  .launch-card {
    padding: 22px;
    background: var(--surface);
    border: 1px solid var(--surface-line);
    border-radius: 12px;
  }
  .launch-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 6px; }
  .launch-head h2 { margin: 0; font-size: 17px; font-weight: 500; }
  .provider { font-size: 13px; color: var(--text-3); }
  .launch-target { margin: 8px 0 0; font-size: 13px; color: var(--text-3); }

  .meter { margin: 18px 0 10px; }
  .meter-track { height: 6px; background: var(--track); border-radius: 999px; overflow: hidden; }
  .meter-fill { height: 100%; background: var(--cyan); border-radius: 999px; transition: width .3s; }
  .meter-legend { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12.5px; color: var(--text-3); }
  .meter-legend b { color: var(--text); font-weight: 600; }

  .fit { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; }
  .fit-yes { color: var(--cyan); font-weight: 500; }
  .fit-no { color: var(--text-4); line-height: 1.6; }
  .fit-no b { color: var(--text-3); font-weight: 500; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-left">
    <div class="brand">Aether <span>Launch Discovery</span></div>
    <nav class="nav" id="nav"></nav>
  </div>
  <div class="account" id="account"></div>
</header>

<main class="wrap">
  <div class="banner" id="banner"></div>

  <div class="page-head">
    <div>
      <p class="eyebrow">Launches</p>
      <h1><span class="lite">Capacity</span> <span class="bold">on offer</span></h1>
      <p class="lede">Flights with spare mass, published by launch providers. Unlike requirements, supply is advertised openly.</p>
    </div>
  </div>

  <div class="browse">
    <form class="filters" id="filters">
      <div class="filter-head">
        <p class="eyebrow">Filter</p>
        <button type="button" class="reveal" id="clear">Clear</button>
      </div>

      <div class="field">
        <label for="orbit">Orbit</label>
        <select id="orbit"><option value="">Any</option></select>
      </div>

      <div class="field">
        <label for="minAvailable">Spare capacity from (kg)</label>
        <input id="minAvailable" type="number" min="0" step="1" placeholder="kg">
      </div>

      <div class="pair">
        <div class="field">
          <label for="from">Window from</label>
          <input id="from" type="month">
        </div>
        <div class="field">
          <label for="to">to</label>
          <input id="to" type="month">
        </div>
      </div>
    </form>

    <section>
      <div class="result-head" style="margin-bottom:18px">
        <span class="result-count" id="count" style="font-size:13px;color:var(--text-3)"></span>
      </div>
      <div class="rows" id="rows"></div>
      <div class="empty" id="empty" hidden>
        <h2><span class="lite">No launches</span> <b>listed</b></h2>
        <p>Nothing matches those filters yet. Providers publish flights as manifests firm up.</p>
      </div>
    </section>
  </div>
</main>

<script src="nav.js"></script>
<script src="launches.js"></script>
</body>
</html>
