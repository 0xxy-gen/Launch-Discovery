<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aether — Inbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,700&display=swap">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<link rel="stylesheet" href="app.css">
<style>
  body { height: 100vh; overflow: hidden; }
  .inbox { display: grid; grid-template-columns: 380px minmax(0, 1fr); height: calc(100vh - 67px); }
  @media (max-width: 860px) { .inbox { grid-template-columns: 1fr; } .thread-pane { display: none; } }

  /* ── list ─────────────────────────────────────────────────────────────── */
  .list-pane { border-right: 1px solid var(--surface-line); display: flex; flex-direction: column; min-height: 0; }
  .list-head { padding: 22px 22px 14px; }
  .list-head h1 { font-size: 26px; letter-spacing: -0.03em; }
  .pills { display: flex; gap: 8px; margin-top: 16px; }
  .pill-btn {
    padding: 7px 15px;
    background: transparent;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    color: var(--text-3);
    font: inherit; font-size: 13px;
    cursor: pointer;
  }
  .pill-btn.on { border-color: var(--text); color: var(--text); }

  .threads { flex: 1; overflow-y: auto; padding: 6px 10px 20px; }
  .thread {
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr) auto;
    gap: 0 12px;
    width: 100%;
    padding: 12px;
    background: none;
    border: 0;
    border-radius: 12px;
    text-align: left;
    cursor: pointer;
    font: inherit;
  }
  .thread:hover { background: var(--tint); }
  .thread.current { background: var(--tint); }
  .thread-glyph {
    grid-row: span 3;
    width: 44px; height: 44px;
    display: grid; place-items: center;
    background: linear-gradient(180deg, #01060a, #06202b);
    border: 1px solid var(--surface-line);
    border-radius: 12px;
    color: var(--cyan);
  }
  .thread-context { font-size: 11.5px; color: var(--text-4); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thread-name { font-size: 14.5px; font-weight: 500; color: var(--text); }
  .thread-last { font-size: 13px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thread-time { grid-row: 3; font-size: 12px; color: var(--text-4); white-space: nowrap; }
  .thread-dot { grid-row: 1; width: 8px; height: 8px; margin-top: 4px; border-radius: 50%; background: var(--cyan); }

  /* ── conversation ─────────────────────────────────────────────────────── */
  .thread-pane { display: flex; flex-direction: column; min-height: 0; }
  .thread-head { padding: 20px 28px; border-bottom: 1px solid var(--surface-line); }
  .thread-head h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .thread-head p { margin: 4px 0 0; font-size: 13px; color: var(--text-3); }

  .messages { flex: 1; overflow-y: auto; padding: 24px 28px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 68%; }
  .msg.mine { align-self: flex-end; }
  .msg-who { margin-bottom: 5px; font-size: 12px; color: var(--text-4); }
  .msg.mine .msg-who { text-align: right; }
  .msg-body {
    padding: 11px 14px;
    background: var(--surface);
    border: 1px solid var(--surface-line);
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.mine .msg-body { background: var(--cyan); border-color: transparent; color: #04181d; }

  .composer { display: flex; gap: 12px; padding: 16px 28px 22px; border-top: 1px solid var(--surface-line); }
  .composer textarea { min-height: 44px; max-height: 160px; }
  .composer button { width: auto; margin: 0; padding: 0 22px; white-space: nowrap; }

  .greeting { flex: 1; display: grid; place-items: center; text-align: center; padding: 40px; }
  .greeting h2 { margin: 22px 0 8px; font-size: 26px; font-weight: 300; letter-spacing: -0.03em; }
  .greeting h2 b { font-weight: 700; }
  .greeting p { margin: 0; font-size: 14px; color: var(--text-3); }
  .greeting .note { margin-top: 22px; max-width: 420px; font-size: 12.5px; color: var(--text-4); line-height: 1.6; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-left">
    <div class="brand">Aether <span>Launch Discovery</span></div>
    <nav class="nav" id="nav"></nav>
  </div>
  <div class="account" id="account"></div>
</header>

<div class="inbox">
  <section class="list-pane">
    <div class="list-head">
      <h1><span class="lite">Your</span> <span class="bold">inbox</span></h1>
      <div class="pills">
        <button class="pill-btn on" data-filter="all" type="button">All</button>
        <button class="pill-btn" data-filter="unread" type="button">Unread</button>
      </div>
    </div>
    <div class="threads" id="threads"></div>
  </section>

  <section class="thread-pane" id="pane">
    <div class="greeting" id="greeting">
      <div>
        <svg viewBox="0 0 64 64" width="58" height="58" fill="none" stroke="var(--cyan)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" style="opacity:.7">
          <path d="M54 32a22 22 0 01-22 22H14l-5 5V32a22 22 0 0122-22h1a22 22 0 0122 22z"/>
          <path d="M22 28h20M22 36h12"/>
        </svg>
        <h2 id="hello"><span class="lite">Hello</span></h2>
        <p id="unread-line"></p>
        <p class="note">Every pool you join gets a group chat here. Introductions between a provider and an owner will land here too, once accepting a match is built.</p>
      </div>
    </div>
  </section>
</div>

<script src="nav.js"></script>
<script src="messages.js"></script>
</body>
</html>
