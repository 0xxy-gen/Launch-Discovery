<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aether — Introductions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,700&display=swap">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<link rel="stylesheet" href="app.css">
<style>
  .note { max-width: 620px; }
  .step {
    display: grid;
    grid-template-columns: 28px 1fr;
    gap: 14px;
    padding: 18px 20px;
    margin-bottom: 10px;
    background: var(--surface);
    border: 1px solid var(--surface-line);
    border-radius: 12px;
  }
  .step-n {
    width: 26px; height: 26px;
    display: grid; place-items: center;
    background: var(--tint);
    border-radius: 50%;
    font-size: 12px; font-weight: 700;
    color: var(--text-3);
  }
  .step h3 { margin: 2px 0 5px; font-size: 14.5px; font-weight: 600; }
  .step p { margin: 0; font-size: 13px; line-height: 1.55; color: var(--text-3); }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-left">
    <div class="brand">Aether <span>Launch Discovery</span></div>
    <nav class="nav" id="nav"></nav>
  </div>
  <div class="account" id="account"></div>
</header>

<main class="wrap">
  <div class="page-head">
    <div>
      <p class="beta-note" style="display:inline-flex;align-items:center;gap:8px;padding:6px 12px;margin-bottom:22px;border:1px solid var(--surface-line);border-radius:999px;font-size:12.5px;color:var(--text-3)">
        <b style="color:var(--cyan);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:10px">Not yet</b>
        Introductions are not wired up
      </p>
      <h1><span class="lite">Your</span> <span class="bold">introductions</span></h1>
      <p class="lede">When a match is accepted, the conversation will live here. Nothing sends messages today — the button that would start one is deliberately inert rather than pretending.</p>
    </div>
  </div>

  <div class="note" id="steps"></div>
</main>

<script src="nav.js"></script>
<script src="messages.js"></script>
</body>
</html>
