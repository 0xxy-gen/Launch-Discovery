<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aether — Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,700&display=swap">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<style>
  /* Split: form column left, visual panel right */
  .split {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    height: 100vh;
    padding: 10px;
  }

  .pane {
    border: 1px solid var(--surface-line);
    border-radius: var(--radius-panel);
    overflow: hidden;
  }

  .form-pane {
    display: flex;
    background: var(--surface);
    overflow-y: auto;
    overscroll-behavior: contain;
  }

  /* margin:auto centres the column when it is shorter than the pane */
  .form-col {
    width: 100%;
    max-width: 400px;
    margin: auto;
    padding: 56px 30px;
  }

  .visual-pane { position: relative; background: #000; }
  .visual-pane svg { display: block; width: 100%; height: 100%; }
  .visual-pane .drift { animation: drift 90s ease-in-out infinite alternate; }
  @keyframes drift  { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-10px, -16px, 0); } }
  @media (prefers-reduced-motion: reduce) {
    .visual-pane .drift { animation: none; }
  }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
</style>
</head>
<body>
<div class="split">
  <section class="pane form-pane">
    <div class="form-col">

  <!-- signed-out -->
  <section id="auth" class="panel">
    <div class="panel-head">
      <p class="eyebrow" id="eyebrow">Authentication</p>
      <h1 id="headline"><span class="lite">Access</span> <span class="bold">Aether</span></h1>
      <p class="lede" id="lede">Sign in to continue to mission control.</p>
    </div>

    <div class="tabs" role="tablist">
      <button role="tab" id="tab-signin" aria-selected="true" aria-controls="form">Sign in</button>
      <button role="tab" id="tab-register" aria-selected="false" aria-controls="form">Register</button>
    </div>

    <div class="panel-body">
      <div class="banner" id="banner"></div>

      <form id="form" novalidate>
        <!-- register only: the one answer that decides everything downstream -->
        <div class="field" id="intent-field" hidden>
          <p class="field-label" id="account-type-label">I am looking to</p>
          <div class="choices" id="account-type" role="radiogroup" aria-labelledby="account-type-label"></div>
          <div class="err" id="account-type-err"></div>
        </div>

        <div class="pair" id="name-field" hidden>
          <div class="field">
            <label for="firstName">First name</label>
            <input id="firstName" name="firstName" type="text" placeholder="Alex" autocomplete="given-name">
            <div class="err" id="firstName-err"></div>
          </div>
          <div class="field">
            <label for="lastName">Last name</label>
            <input id="lastName" name="lastName" type="text" placeholder="Mbeki" autocomplete="family-name">
            <div class="err" id="lastName-err"></div>
          </div>
        </div>

        <div class="field" id="role-field" hidden>
          <label for="role">Your role</label>
          <input id="role" name="role" type="text" placeholder="e.g. Mission Manager" autocomplete="organization-title">
          <div class="err" id="role-err"></div>
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@organisation.com" required>
          <div class="err" id="email-err"></div>
        </div>

        <div class="field">
          <div class="label-row">
            <label for="password">Password</label>
            <button type="button" class="reveal" id="reveal">Show</button>
          </div>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
          <div class="err" id="password-err"></div>
        </div>

        <button class="primary" type="submit" id="submit">Sign in</button>
      </form>

      <p class="note" id="note"></p>
    </div>
  </section>

  <p class="disclaimer">Development build — accounts are stored in a local SQLite database, passwords hashed with scrypt, sessions held in httpOnly cookies.</p>
    </div>
  </section>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const form = $('form'), banner = $('banner'), note = $('note'), submit = $('submit');
  const email = $('email'), password = $('password');
  const firstName = $('firstName'), lastName = $('lastName'), role = $('role');
  const accountType = $('account-type');            // radiogroup container
  const intentField = $('intent-field');
  const tabSignin = $('tab-signin'), tabRegister = $('tab-register');

  const FIELDS = [email, password, accountType, firstName, lastName, role];
  const accountTypeValue = () => accountType.querySelector('input:checked')?.value ?? '';

  let mode = 'signin';
  let busy = false;

  // ─── api ──────────────────────────────────────────────────────────────────

  async function api(path, { method = 'GET', body } = {}) {
    const res = await fetch(path, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined,
      credentials: 'same-origin',
    });
    const data = res.status === 204 ? {} : await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, data };
  }

  // ─── form helpers ─────────────────────────────────────────────────────────

  const validEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim());

  function setError(input, msg) {
    $(input.id + '-err').textContent = msg || '';
    input.setAttribute('aria-invalid', msg ? 'true' : 'false');
    return !msg;
  }

  // The server keys its errors on the same ids, so they paint inline too.
  function showFieldErrors(fields = {}) {
    for (const [id, msg] of Object.entries(fields)) {
      const el = $(id);
      if (el) setError(el, msg);
    }
  }

  function showBanner(msg, kind) {
    banner.textContent = msg;
    banner.className = 'banner show ' + kind;
  }
  const clearBanner = () => { banner.className = 'banner'; };

  function setBusy(state) {
    busy = state;
    submit.disabled = state;
    submit.textContent = state
      ? (mode === 'register' ? 'Creating account…' : 'Signing in…')
      : (mode === 'register' ? 'Create account' : 'Sign in');
  }

  function setMode(next) {
    mode = next;
    const registering = mode === 'register';
    tabSignin.setAttribute('aria-selected', String(!registering));
    tabRegister.setAttribute('aria-selected', String(registering));
    $('eyebrow').textContent = registering ? 'New account' : 'Authentication';
    $('headline').innerHTML = registering
      ? '<span class="lite">Request</span> <span class="bold">Access</span>'
      : '<span class="lite">Access</span> <span class="bold">Aether</span>';
    $('lede').textContent = registering
      ? 'Your own account. You set up the company next, and can add colleagues to it later.'
      : 'Sign in to continue to mission control.';
    submit.textContent = registering ? 'Create account' : 'Sign in';
    intentField.hidden = !registering;
    $('name-field').hidden = !registering;
    $('role-field').hidden = !registering;
    password.setAttribute('autocomplete', registering ? 'new-password' : 'current-password');
    note.textContent = registering ? 'Minimum 8 characters' : '';
    FIELDS.forEach(i => setError(i, ''));
    clearBanner();
  }

  tabSignin.addEventListener('click', () => setMode('signin'));
  tabRegister.addEventListener('click', () => setMode('register'));
  [email, password, firstName, lastName, role].forEach(i => i.addEventListener('input', () => setError(i, '')));
  accountType.addEventListener('change', () => setError(accountType, ''));

  $('reveal').addEventListener('click', () => {
    const shown = password.type === 'text';
    password.type = shown ? 'password' : 'text';
    $('reveal').textContent = shown ? 'Show' : 'Hide';
  });

  // ─── submit ───────────────────────────────────────────────────────────────

  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (busy) return;
    clearBanner();

    let ok = setError(email, validEmail(email.value) ? '' : 'Enter a valid email address.');
    ok = setError(password, password.value ? '' : 'Password is required.') && ok;

    if (mode === 'register') {
      if (password.value && password.value.length < 8) {
        ok = setError(password, 'Use at least 8 characters.') && ok;
      }
      ok = setError(accountType, accountTypeValue() ? '' : 'Pick one to continue.') && ok;
      ok = setError(firstName, firstName.value.trim() ? '' : 'Enter your first name.') && ok;
      ok = setError(lastName, lastName.value.trim() ? '' : 'Enter your last name.') && ok;
      ok = setError(role, role.value.trim() ? '' : 'What do you do?') && ok;
    }
    if (!ok) return;

    const payload = { email: email.value, password: password.value };
    if (mode === 'register') {
      payload.accountType = accountTypeValue();
      payload.firstName = firstName.value;
      payload.lastName = lastName.value;
      payload.role = role.value;
    }

    setBusy(true);
    let res;
    try {
      res = await api(mode === 'register' ? '/api/register' : '/api/login',
                      { method: 'POST', body: payload });
    } catch {
      setBusy(false);
      return showBanner('Cannot reach the server. Is it running?', 'bad');
    }
    setBusy(false);

    // A new account goes straight to the company form; a returning one goes
    // wherever it left off, which the server decides.
    if (res.ok) return location.assign(mode === 'register' ? '/profile?new=1' : '/');

    showFieldErrors(res.data.fields);
    if (res.data.error) showBanner(res.data.error, 'bad');
    else if (res.status === 429) showBanner('Too many attempts. Try again shortly.', 'bad');
  });

  // ─── boot ─────────────────────────────────────────────────────────────────

  async function loadOptions() {
    const { ok, data } = await api('/api/options');
    if (!ok) throw new Error('options');
    for (const t of data.accountTypes) {
      const card = document.createElement('label');
      card.className = 'choice';

      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = 'accountType';
      radio.value = t.value;

      const label = document.createElement('span');
      label.className = 'choice-label';
      label.textContent = t.label;

      const help = document.createElement('span');
      help.className = 'choice-help';
      help.textContent = t.help;

      card.append(radio, label, help);
      accountType.appendChild(card);
    }
  }

  async function loadSession() {
    // The server also redirects a signed-in visitor; this only fires when a
    // session appears while the page is already open.
    const { ok } = await api('/api/me');
    if (ok) location.assign('/');
  }

  setMode('signin');
  Promise.all([loadOptions(), loadSession()]).catch(() => {
    showBanner('Cannot reach the server. Is it running?', 'bad');
  });
})();
</script>
</body>
</html>
