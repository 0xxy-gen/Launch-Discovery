<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aether — Saved launches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,700&display=swap">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<link rel="stylesheet" href="app.css">
<style>
  .launch-card { padding: 22px; background: var(--surface); border: 1px solid var(--surface-line); border-radius: 12px; }
  .launch-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
  .launch-head h2 { margin: 0 0 6px; font-size: 17px; font-weight: 500; }
  .provider { font-size: 13px; color: var(--text-3); }
  .launch-target { margin: 0; font-size: 13px; color: var(--text-3); }
  .meter { margin: 18px 0 0; }
  .meter-track { height: 6px; background: var(--track); border-radius: 999px; overflow: hidden; }
  .meter-fill { height: 100%; background: var(--cyan); border-radius: 999px; }
  .meter-legend { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12.5px; color: var(--text-3); }
  .meter-legend b { color: var(--text); font-weight: 600; }
  .saved-at { margin-top: 14px; font-size: 12px; color: var(--text-4); }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-left">
    <div class="brand">Aether <span>Launch Discovery</span></div>
    <nav class="nav" id="nav"></nav>
  </div>
  <div class="account" id="account"></div>
</header>

<main class="wrap">
  <div class="banner" id="banner"></div>

  <div class="page-head">
    <div>
      <p class="eyebrow">Saved</p>
      <h1><span class="lite">Launch</span> <span class="bold">opportunities</span></h1>
      <p class="lede">Flights your company has shortlisted. Saving is shared — anyone on the account sees the same list.</p>
    </div>
  </div>

  <div class="rows" id="rows"></div>

  <div class="empty" id="empty" hidden>
    <h2><span class="lite">Nothing saved</span> <b>yet</b></h2>
    <p>Star a flight on the Launches tab and it lands here for the whole team.</p>
    <a class="primary" href="/launches" style="display:inline-block;text-decoration:none;padding:12px 22px;border-radius:var(--radius-btn);color:#000">Browse launches</a>
  </div>
</main>

<script src="nav.js"></script>
<script src="saved.js"></script>
</body>
</html>
