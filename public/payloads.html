<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aether — Payloads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,700&display=swap">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app.css">
<style>
  .browse { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 40px; align-items: start; }
  @media (max-width: 860px) { .browse { grid-template-columns: 1fr; } }

  .filters { position: sticky; top: 28px; }
  .filters .field { margin-bottom: 20px; }
  .filters label { font-size: 12.5px; }
  .filters select, .filters input { font-size: 14px; padding: 8px 0; }
  .filters .pair { gap: 0 12px; }
  .filter-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
  .filter-head .eyebrow { margin: 0; }

  .result-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
  .result-count { font-size: 13px; color: var(--text-3); }

  .payload-card {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 14px 24px;
    padding: 20px 22px;
    background: var(--surface);
    border: 1px solid var(--surface-line);
    border-radius: 12px;
  }
  .payload-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .payload-ref { font-size: 15px; font-weight: 600; letter-spacing: 0.04em; }
  .payload-jur { font-size: 12px; color: var(--text-4); }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-left">
    <div class="brand">Aether <span>Launch Discovery</span></div>
    <nav class="nav" id="nav"></nav>
  </div>
  <div class="whoami">
    <span id="whoami"></span>
    <button class="ghost-sm" id="signout">Sign out</button>
  </div>
</header>

<main class="wrap">
  <div class="banner" id="banner"></div>

  <div class="page-head">
    <div>
      <p class="eyebrow">Payloads</p>
      <h1><span class="lite">Looking for</span> <span class="bold">launch</span></h1>
      <p class="lede">Published requirements from payload owners. Identities and exact figures stay with the owner until they accept an introduction.</p>
    </div>
  </div>

  <div class="browse">
    <form class="filters" id="filters">
      <div class="filter-head">
        <p class="eyebrow">Filter</p>
        <button type="button" class="reveal" id="clear">Clear</button>
      </div>

      <div class="field">
        <label for="orbit">Orbit</label>
        <select id="orbit"><option value="">Any</option></select>
      </div>

      <div class="field">
        <label for="ride">Ride</label>
        <select id="ride"><option value="">Any</option></select>
      </div>

      <div class="field">
        <label for="form">Form factor</label>
        <select id="form"><option value="">Any</option></select>
      </div>

      <div class="pair">
        <div class="field">
          <label for="massMin">Mass from</label>
          <input id="massMin" type="number" min="0" step="1" placeholder="kg">
        </div>
        <div class="field">
          <label for="massMax">to</label>
          <input id="massMax" type="number" min="0" step="1" placeholder="kg">
        </div>
      </div>

      <div class="pair">
        <div class="field">
          <label for="from">Window from</label>
          <input id="from" type="month">
        </div>
        <div class="field">
          <label for="to">to</label>
          <input id="to" type="month">
        </div>
      </div>
    </form>

    <section>
      <div class="result-head">
        <span class="result-count" id="count"></span>
      </div>
      <div class="rows" id="rows"></div>
      <div class="empty" id="empty" hidden>
        <h2><span class="lite">No requirements</span> <b>match</b></h2>
        <p>Widen the filters, or check back — owners publish as campaigns firm up.</p>
      </div>
    </section>
  </div>
</main>

<script src="nav.js"></script>
<script src="payloads.js"></script>
</body>
</html>
