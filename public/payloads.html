<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aether — Payloads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,700&display=swap">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<link rel="stylesheet" href="app.css">
<style>
  /* filters run across the top so the grid gets the full width */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 18px 22px;
    padding: 18px 20px;
    margin-bottom: 26px;
    background: var(--surface);
    border: 1px solid var(--surface-line);
    border-radius: 12px;
  }
  .filter-bar .field { margin: 0; min-width: 132px; }
  .filter-bar label { margin-bottom: 2px; font-size: 12px; color: var(--text-3); }
  .filter-bar select, .filter-bar input { padding: 6px 0; font-size: 14px; }
  .filter-bar select { padding-right: 22px; }
  .filter-bar .clear { margin-left: auto; }

  .count { margin-bottom: 20px; font-size: 16px; color: var(--text-3); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(clamp(290px, 21vw, 460px), 1fr));
    gap: clamp(20px, 1.6vw, 32px);
  }

  .card {
    display: flex;
    flex-direction: column;
    padding: clamp(28px, 2vw, 40px) clamp(24px, 1.8vw, 34px) clamp(28px, 2vw, 36px);
    background: var(--surface);
    border: 1px solid var(--surface-line);
    border-radius: 14px;
  }

  .glyph { align-self: center; margin: 14px 0 26px; }

  .card-ref {
    margin: 0;
    font-size: clamp(21px, 1.5vw, 27px);
    font-weight: 600;
    letter-spacing: 0.04em;
    text-align: center;
  }
  .card-sub {
    margin: 8px 0 0;
    font-size: clamp(14.5px, 1vw, 18px);
    color: var(--text-3);
    text-align: center;
  }
  .card-orbit {
    margin: clamp(18px, 1.4vw, 26px) 0 clamp(24px, 2vw, 34px);
    font-size: clamp(19px, 1.3vw, 24px);
    font-weight: 600;
    line-height: 1.3;
    letter-spacing: -0.01em;
    text-align: center;
  }

  .spec-rows { display: grid; gap: clamp(14px, 1.1vw, 20px); margin-top: auto; font-size: clamp(15.5px, 1.05vw, 19px); }
  .spec-row { display: grid; grid-template-columns: 20px 1fr; align-items: center; gap: 11px; color: var(--text-2); }
  .spec-row svg { color: var(--text-4); }

  .card-actions { margin-top: 26px; }
  .card-actions button { width: 100%; }

  /* the in-grid prompt, Qasa's pink cell */
  .cta-card {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 34px 28px;
    background: var(--cyan);
    border-radius: 14px;
    color: #04181d;
  }
  .cta-card svg { display: block; margin: 0 0 18px; color: #04181d; opacity: .85; }
  .cta-card h2 { margin: 0 0 18px; font-size: clamp(26px, 2vw, 36px); font-weight: 700; line-height: 1.15; letter-spacing: -0.03em; }
  .cta-card p { margin: 0 0 34px; font-size: clamp(15px, 1.05vw, 19px); line-height: 1.5; opacity: .8; }
  .cta-card a {
    align-self: flex-start;
    padding: 14px 26px;
    background: #04181d;
    border-radius: 999px;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
  }
  .cta-card a:hover { background: #0b2a32; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-left">
    <div class="brand">Aether <span>Launch Discovery</span></div>
    <nav class="nav" id="nav"></nav>
  </div>
  <div class="account" id="account"></div>
</header>

<main class="wrap">
  <div class="banner" id="banner"></div>

  <div class="page-head">
    <div>
      <p class="eyebrow">Payloads</p>
      <h1><span class="lite">Looking for</span> <span class="bold">launch</span></h1>
      <p class="lede">Satellite missions looking for a ride. Identities and exact figures stay with the owner until they accept an introduction.</p>
    </div>
  </div>

  <div class="count" id="count"></div>

  <form class="filter-bar" id="filters">
    <div class="field">
      <label for="orbit">Orbit</label>
      <select id="orbit"><option value="">Any</option></select>
    </div>
    <div class="field">
      <label for="ride">Ride</label>
      <select id="ride"><option value="">Any</option></select>
    </div>
    <div class="field">
      <label for="form">Form factor</label>
      <select id="form"><option value="">Any</option></select>
    </div>
    <div class="field">
      <label for="massMin">Mass from (kg)</label>
      <input id="massMin" type="number" min="0" step="1" placeholder="Any">
    </div>
    <div class="field">
      <label for="massMax">to (kg)</label>
      <input id="massMax" type="number" min="0" step="1" placeholder="Any">
    </div>
    <div class="field">
      <label for="from">Window from</label>
      <input id="from" type="month">
    </div>
    <div class="field">
      <label for="to">to</label>
      <input id="to" type="month">
    </div>
    <button type="button" class="reveal clear" id="clear">Clear</button>
  </form>

  <div class="grid" id="rows"></div>

  <div class="empty" id="empty" hidden>
    <h2><span class="lite">No missions</span> <b>match</b></h2>
    <p>Widen the filters, or check back — owners publish as campaigns firm up.</p>
  </div>
</main>

<script src="nav.js"></script>
<script src="payloads.js"></script>
</body>
</html>
